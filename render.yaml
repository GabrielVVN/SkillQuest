services:
  - type: web
    name: skillquest
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///skillquest.db
      - key: PORT
        fromService:
          type: web
          name: skillquest
          property: port