<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillQuest - Suas Quests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Nunito', 'sans-serif'] }, colors: { primary: '#6366f1', primaryDark: '#4f46e5', bgLight: '#f8fafc', surfaceLight: '#ffffff', bgDark: '#0f172a', surfaceDark: '#1e293b', textLight: '#334155', textDark: '#e2e8f0' } } } }
    </script>
    
    <style type="text/tailwindcss">
        @layer components {
            .btn-primary { @apply bg-primary hover:bg-primaryDark text-white font-bold py-4 px-6 rounded-2xl shadow-[0_6px_0_#4f46e5] active:shadow-[0_0px_0_#4f46e5] active:translate-y-1.5 transition-all text-lg flex items-center justify-center gap-2 cursor-pointer w-full; }
            .quest-card { @apply bg-surfaceLight dark:bg-surfaceDark border border-slate-200 dark:border-slate-700 p-6 rounded-[2rem] shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col relative overflow-hidden; }
            .option-btn { @apply bg-surfaceLight dark:bg-surfaceDark border-2 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold py-6 px-8 rounded-[2rem] text-xl text-left transition-all duration-150 relative flex items-center gap-6 cursor-pointer w-full shadow-sm; }
            .option-btn:hover { @apply border-primary/50 dark:border-primary/50 shadow-md; transform: translateY(-2px); }
            .option-btn:active { transform: translateY(2px); box-shadow: 0 0 0 transparent; }
            .option-btn.correct { @apply border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.15)]; z-index: 10; }
            .option-btn.wrong { @apply border-rose-500 bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 opacity-60; transform: translateY(4px); }
            .option-marker { @apply flex items-center justify-center w-10 h-10 rounded-xl border-2 border-slate-300 dark:border-slate-600 text-base flex-shrink-0 transition-colors duration-300 font-black; }
            .option-btn:hover .option-marker { @apply border-primary/50 text-primary dark:text-primary; }
            .option-btn.correct .option-marker { @apply border-emerald-500 bg-emerald-500 text-white; }
            .option-btn.wrong .option-marker { @apply border-rose-500 bg-rose-500 text-white; }
            .input-field { @apply w-full bg-slate-100 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-2xl px-6 py-4 text-lg font-bold text-slate-700 dark:text-slate-200 focus:outline-none focus:border-primary transition-colors; }
        }
        body { transition: background-color 0.5s ease, color 0.5s ease; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="bg-bgLight text-textLight dark:bg-bgDark dark:text-textDark font-sans h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-white">

    <div class="absolute top-6 right-6 z-50">
        <button id="theme-toggle" class="p-3 bg-surfaceLight dark:bg-surfaceDark rounded-full shadow-lg hover:scale-110 transition-transform duration-300 border border-slate-200 dark:border-slate-700">
            <span id="theme-icon-dark" class="hidden text-xl">🌙</span>
            <span id="theme-icon-light" class="text-xl text-yellow-500">☀️</span>
        </button>
    </div>

    <div id="auth-screen" class="absolute inset-0 flex flex-col items-center justify-center z-40 bg-bgLight dark:bg-bgDark transition-opacity duration-500">
        <div class="w-full max-w-md p-10 bg-surfaceLight dark:bg-surfaceDark rounded-[2rem] shadow-xl border border-slate-100 dark:border-slate-800">
            <h1 class="text-5xl font-black text-primary tracking-tight text-center mb-8">SkillQuest</h1>
            <div id="auth-error" class="hidden bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 font-bold p-4 rounded-xl mb-6 text-center"></div>
            
            <form id="auth-form" class="space-y-6">
                <input type="text" id="auth-username" class="input-field" placeholder="Nome de Usuário" required autocomplete="off">
                <input type="password" id="auth-password" class="input-field" placeholder="Senha" required>
                <button type="submit" id="auth-submit-btn" class="btn-primary">Entrar</button>
            </form>
            
            <div class="mt-8 text-center text-slate-500 font-bold">
                <span id="auth-toggle-text">Novo por aqui?</span> 
                <button id="auth-toggle-btn" class="text-primary hover:underline ml-1">Criar Conta</button>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden flex-col h-full w-full max-w-6xl mx-auto p-6 md:p-10 relative overflow-y-auto">
        <header class="flex flex-col md:flex-row items-center justify-between mb-8 gap-6 w-full">
            <h1 class="text-4xl md:text-5xl font-black text-primary tracking-tight">SkillQuest</h1>
            <div class="flex items-center gap-6 bg-surfaceLight dark:bg-surfaceDark py-3 px-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                <div class="flex items-center gap-3 pr-6 border-r-2 border-slate-200 dark:border-slate-700">
                    <span class="text-xl">👤</span>
                    <span id="profile-username" class="font-black text-slate-700 dark:text-slate-200 text-lg">Jogador</span>
                    <button id="btn-logout" class="text-xs font-bold text-rose-500 hover:text-rose-600 ml-2">(Sair)</button>
                </div>
                <div class="flex items-center gap-2 text-primary font-bold text-xl">
                    <span>⭐</span> <span id="dash-xp">0</span> XP
                </div>
                <div class="flex items-center gap-2 text-indigo-400 font-bold text-xl border-l-2 border-slate-200 dark:border-slate-700 pl-6">
                    <span>Lvl</span> <span id="dash-level">1</span>
                </div>
            </div>
        </header>

        <main class="flex-1 w-full">
            <div class="flex gap-8 mb-8 border-b-2 border-slate-200 dark:border-slate-800">
                <button id="tab-quests" class="text-2xl font-extrabold text-primary border-b-4 border-primary pb-4 px-2 transition-all">Minhas Matérias</button>
                <button id="tab-ranking" class="text-2xl font-extrabold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 border-b-4 border-transparent pb-4 px-2 transition-all">Ranking Global</button>
            </div>

            <div id="quests-section" class="block w-full">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold text-slate-500 dark:text-slate-400">Continue seu treinamento</h2>
                    <input type="file" id="json-upload" accept=".json" class="hidden">
                    <button onclick="document.getElementById('json-upload').click()" class="btn-primary w-auto py-3 px-5 text-base shadow-sm">
                        <span>➕ Nova Quest</span>
                    </button>
                </div>
                <p id="upload-error" class="text-rose-500 font-semibold text-sm hidden bg-rose-50 dark:bg-rose-900/20 p-3 rounded-xl mb-6"></p>
                <div id="modules-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10"></div>
            </div>

            <div id="ranking-section" class="hidden w-full flex-col">
                <div class="bg-surfaceLight dark:bg-surfaceDark rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="grid grid-cols-12 gap-4 p-6 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-800 font-black text-slate-500 text-sm uppercase tracking-wider">
                        <div class="col-span-2 text-center">Posição</div>
                        <div class="col-span-5">Jogador</div>
                        <div class="col-span-3 text-center">Liga</div>
                        <div class="col-span-2 text-right">XP Total</div>
                    </div>
                    <div id="leaderboard-list" class="flex flex-col divide-y divide-slate-100 dark:divide-slate-800"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="game-screen" class="hidden flex-col h-full max-w-5xl mx-auto w-full p-6 relative">
        <header class="flex items-center justify-between mt-4 mb-6 gap-6 bg-surfaceLight dark:bg-surfaceDark p-4 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 w-full relative">
            <button id="btn-back-dash" class="absolute -left-4 -top-4 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-700 dark:text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md transition-all z-10" title="Voltar ao Lobby">❌</button>
            <div class="flex-1 bg-slate-200 dark:bg-slate-700 h-5 rounded-full overflow-hidden relative ml-6">
                <div id="progress-bar" class="bg-primary h-full w-0 transition-all duration-700 ease-out relative"><div class="absolute inset-0 bg-white/20 w-full animate-[shimmer_2s_infinite]"></div></div>
            </div>
            <div class="flex items-center gap-6 px-4">
                <div class="flex items-center gap-2 text-orange-500 font-bold text-xl"><span>🔥</span> <span id="streak-display">0</span></div>
            </div>
        </header>
        <main class="flex-1 flex flex-col justify-center items-center w-full max-w-4xl mx-auto py-2">
            <h2 id="question-text" class="w-full text-3xl md:text-5xl font-extrabold text-center mb-16 text-slate-800 dark:text-slate-100 leading-tight md:leading-snug tracking-tight px-4"></h2>
            <div id="options-container" class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 px-4"></div>
        </main>
    </div>

    <div id="end-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center z-50 bg-bgLight dark:bg-bgDark">
        <div class="bg-surfaceLight dark:bg-surfaceDark p-12 rounded-[3rem] text-center shadow-2xl border border-slate-100 dark:border-slate-800">
            <h1 class="text-5xl font-black text-primary mb-6">Quest Concluída! 🎉</h1>
            <p class="text-xl text-slate-500 dark:text-slate-400 mb-10">Você dominou essa matéria.</p>
            <button id="btn-return-lobby" class="btn-primary py-5 px-10 w-full">Voltar ao Lobby</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
